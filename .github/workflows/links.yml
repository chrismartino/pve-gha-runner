name: Links

# Not a required check: external sites flake. Runs weekly and on demand, and
# on PRs that touch docs so broken links are noticed.
on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths: ['**.md', 'site/**', '.lychee.toml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress './**/*.md' 'site/**/*.html'
          fail: true
