name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag must be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main; refusing to release"
            exit 1
          fi
      - name: Build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="pve-gha-runner-${TAG}/" -o "dist/pve-gha-runner-${TAG}.tar.gz" "$GITHUB_SHA"
          cp create-pve-lxc-gha-runner.sh gha_runner_hookscript.sh stop-and-cleanup-gha-runners.sh gha-runner-hook.logrotate dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
