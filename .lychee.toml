# Link checker config (see .github/workflows/links.yml)
accept = ["200..=299", "403", "429"]
max_retries = 3
timeout = 20
exclude = [
  # Only resolve once the repo is public / Pages is deployed.
  '^https://chrismartino\.github\.io/',
  '^https://github\.com/chrismartino/pve-gha-runner/security/advisories/new',
  '^https://github\.com/chrismartino/pve-gha-runner/discussions',
  # Example values
  'someorg',
  'myorg',
]
